<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Sync Automation Panel</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: #161b22;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      border: 1px solid #30363d;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #f8fafc;
      text-align: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="url"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #58a6ff;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 5px;
    }

    button:hover {
      background-color: #2ea043;
    }

    button.primary-btn {
      background-color: #1f6feb;
    }

    button.primary-btn:hover {
      background-color: #388bfd;
    }

    button:disabled {
      background-color: #30363d;
      cursor: not-allowed;
      color: #8b949e;
    }

    .post-section {
      display: none;
      margin-top: 25px;
      border-top: 1px solid #30363d;
      padding-top: 20px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .post-header h2 {
      font-size: 1.1rem;
      color: #f1f5f9;
    }

    .select-all-box {
      font-size: 0.85rem;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .post-list {
      max-height: 280px;
      overflow-y: auto;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 20px;
    }

    .post-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #21262d;
    }

    .post-item:last-child {
      border-bottom: none;
    }

    .post-item input[type="checkbox"] {
      margin-top: 4px;
      cursor: pointer;
    }

    .post-details {
      flex: 1;
    }

    .post-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: #f8fafc;
      word-break: break-word;
    }

    .post-meta {
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      background: #21262d;
      color: #58a6ff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-right: 5px;
    }

    .status-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
      word-break: break-word;
    }

    .status-info {
      background: #0d2744;
      color: #79c0ff;
      border: 1px solid #1f6feb;
    }

    .status-success {
      background: #0e331c;
      color: #56d364;
      border: 1px solid #238636;
    }

    .status-error {
      background: #3c1214;
      color: #ff7b72;
      border: 1px solid #f85149;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Story Transfer Panel</h1>

    <div class="form-group">
      <label>1. Source Website (Story URL)</label>
      <input type="url" id="sourceUrl" value="https://tamilsexstories.info/">
    </div>

    <div class="form-group">
      <label>2. Destination Website (Your URL)</label>
      <input type="url" id="destUrl" value="https://darktamilworld.vercel.app/">
    </div>

    <div class="row">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" id="adminUser" placeholder="Prakash">
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="adminPass" placeholder="••••••••">
      </div>
    </div>

    <button type="button" class="primary-btn" id="proceedBtn" onclick="fetchSourcePosts()">Proceed & Fetch Real Posts</button>

    <div id="statusBox" class="status-box"></div>

    <div class="post-section" id="postSection">
      <div class="post-header">
        <h2>Available Posts (<span id="postCount">0</span>)</h2>
        <label class="select-all-box">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"> Select All
        </label>
      </div>

      <div class="post-list" id="postList"></div>

      <button type="button" id="publishBtn" onclick="publishSelectedPosts()">Publish Instant Live to Public</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC55PzXDzUPQdUNvx0qmG6ZgBE-tnRxSL0",
      authDomain: "darktamilworld.firebaseapp.com",
      projectId: "darktamilworld",
      storageBucket: "darktamilworld.firebasestorage.app",
      messagingSenderId: "100069347306",
      appId: "1:100069347306:web:aa05b0d5b2299720c1ac93"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let fetchedStories = [];

    // Helper: Generate First-Letter Dark AI Canvas Poster
    function generateLetterArtCover(title) {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');

      const bgGradients = [
        ['#1e1b4b', '#0f172a', '#431407'],
        ['#022c22', '#0f172a', '#134e4a'],
        ['#311042', '#0f172a', '#581c87'],
        ['#450a0a', '#0f172a', '#1c1917']
      ];
      const selectedTheme = bgGradients[Math.floor(Math.random() * bgGradients.length)];

      const grad = ctx.createLinearGradient(0, 0, 600, 400);
      grad.addColorStop(0, selectedTheme[0]);
      grad.addColorStop(0.5, selectedTheme[1]);
      grad.addColorStop(1, selectedTheme[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 600, 400);

      const radGrad = ctx.createRadialGradient(300, 200, 50, 300, 200, 300);
      radGrad.addColorStop(0, 'rgba(0,0,0,0)');
      radGrad.addColorStop(1, 'rgba(0,0,0,0.7)');
      ctx.fillStyle = radGrad;
      ctx.fillRect(0, 0, 600, 400);

      const cleanTitle = title.trim();
      const firstChar = cleanTitle.charAt(0) || 'D';

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 150px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.shadowColor = '#e11d48';
      ctx.shadowBlur = 25;
      ctx.fillText(firstChar, 300, 170);

      ctx.shadowBlur = 0;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillStyle = '#f8fafc';
      let displayTitle = cleanTitle.length > 32 ? cleanTitle.substring(0, 30) + '...' : cleanTitle;
      ctx.fillText(displayTitle, 300, 320);

      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('DARK TAMIL WORLD', 300, 360);

      return canvas.toDataURL('image/jpeg', 0.85);
    }

    async function fetchSourcePosts() {
      const sourceUrl = document.getElementById('sourceUrl').value.trim();
      const statusBox = document.getElementById('statusBox');
      const proceedBtn = document.getElementById('proceedBtn');
      const postSection = document.getElementById('postSection');

      if (!sourceUrl) {
        alert('Please enter a source URL');
        return;
      }

      proceedBtn.disabled = true;
      proceedBtn.innerText = 'Connecting & Scraping...';
      statusBox.className = 'status-box status-info';
      statusBox.style.display = 'block';
      statusBox.innerText = 'Fetching stories from source website...';
      postSection.style.display = 'none';

      try {
        const apiUrl = `/api/get-posts?url=${encodeURIComponent(sourceUrl)}`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error('Server request failed: ' + response.status);
        }

        const data = await response.json();

        if (data.posts && data.posts.length > 0) {
          fetchedStories = data.posts;
        }

        if (!fetchedStories || fetchedStories.length === 0) {
          throw new Error('No stories found on the source page');
        }

        renderPosts(fetchedStories);
        document.getElementById('postCount').innerText = fetchedStories.length;
        statusBox.className = 'status-box status-success';
        statusBox.innerText = `Success! ${fetchedStories.length} posts retrieved. Choose stories to publish live.`;
        postSection.style.display = 'block';

      } catch (err) {
        statusBox.className = 'status-box status-error';
        statusBox.innerText = `Error: ${err.message}`;
      } finally {
        proceedBtn.disabled = false;
        proceedBtn.innerText = 'Proceed & Fetch Real Posts';
      }
    }

    function renderPosts(posts) {
      const listContainer = document.getElementById('postList');
      listContainer.innerHTML = '';

      posts.forEach(post => {
        const item = document.createElement('div');
        item.className = 'post-item';
        item.innerHTML = `
          <input type="checkbox" class="post-checkbox" value="${post.id}">
          <div class="post-details">
            <div class="post-title">${post.title}</div>
            <div class="post-meta">
              <span class="badge">${post.category || 'காம கதைகள்'}</span>
              ${post.link ? `<a href="${post.link}" target="_blank" style="color: #58a6ff; text-decoration: none;">View Source</a>` : ''}
            </div>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.post-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    async function publishSelectedPosts() {
      const adminUser = document.getElementById('adminUser').value.trim();
      const adminPass = document.getElementById('adminPass').value.trim();
      const statusBox = document.getElementById('statusBox');
      const publishBtn = document.getElementById('publishBtn');

      if (adminUser !== "Prakash" || adminPass !== "Prakash9940@") {
        alert("தவறான Admin விவரங்கள்! சரியான Username & Password தரவும்.");
        return;
      }

      const selectedCheckboxes = document.querySelectorAll('.post-checkbox:checked');
      if (selectedCheckboxes.length === 0) {
        alert('ஏதேனும் ஒரு கதையை தேர்வு செய்யவும்.');
        return;
      }

      const selectedIds = Array.from(selectedCheckboxes).map(cb => cb.value.toString());
      const storiesToPublish = fetchedStories.filter(s => selectedIds.includes(s.id.toString()));

      publishBtn.disabled = true;
      statusBox.className = 'status-box status-info';
      statusBox.style.display = 'block';

      let successCount = 0;

      for (let i = 0; i < storiesToPublish.length; i++) {
        const story = storiesToPublish[i];
        statusBox.innerText = `[${i + 1}/${storiesToPublish.length}] Dark Tamil World-ல் லைவ் செய்கிறது: ${story.title}...`;

        try {
          let storyContent = story.content || '';

          if (!storyContent || storyContent.length < 50) {
            const singleRes = await fetch(`/api/get-posts?url=${encodeURIComponent(story.link)}`);
            if (singleRes.ok) {
              const singleData = await singleRes.json();
              if (singleData.rawHtml) {
                const doc = new DOMParser().parseFromString(singleData.rawHtml, 'text/html');
                const contentElem = doc.querySelector('.entry-content, article .content, .post-content');
                if (contentElem) storyContent = contentElem.innerHTML;
              }
            }
          }

          if (!storyContent) {
            storyContent = `<p>${story.title}</p>`;
          }

          // Category auto-detection
          let finalCategory = story.category && story.category !== 'Story' ? story.category.trim() : 'காம கதைகள்';

          // First-letter AI Canvas cover image
          const generatedCover = generateLetterArtCover(story.title);

          const newDocId = 'dtw_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
          const todayDate = new Date().toLocaleDateString('ta-IN', { year: 'numeric', month: 'short', day: 'numeric' });

          // 100% Instant Public Live Flags
          const postData = {
            id: newDocId,
            title: story.title,
            subtitle: story.title,
            content: storyContent,
            category: finalCategory,
            coverImage: generatedCover,
            images: [generatedCover],
            author: 'Prakash',
            authorRole: 'Admin',
            tags: `${finalCategory}, Tamil, Story`,
            date: todayDate,
            views: 1,
            likes: 0,
            status: 'published',
            approved: true,
            published: true,
            visibility: 'public',
            timestamp: Date.now(),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          // Save to 'posts' (Homepage Feed)
          await db.collection('posts').doc(newDocId).set(postData);

          // Save to 'stories' (Reader Mode Feed)
          await db.collection('stories').doc(newDocId).set(postData);

          // Category Auto-Registry
          try {
            await db.collection('categories').doc(finalCategory).set({
              name: finalCategory,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
          } catch(catErr) {
            console.log('Category auto-registered');
          }

          successCount++;
        } catch (e) {
          console.error("Publishing error:", story.title, e);
        }
      }

      publishBtn.disabled = false;
      if (successCount > 0) {
        statusBox.className = 'status-box status-success';
        statusBox.innerText = `வெற்றி! ${successCount} கதைகள் பப்ளிக் விசிட்டர்ஸுக்கு நேரடியாக உடனே லைவ் ஆகிவிட்டன!`;
        document.querySelectorAll('.post-checkbox').forEach(cb => cb.checked = false);
        const selectAll = document.getElementById('selectAll');
        if (selectAll) selectAll.checked = false;
      } else {
        statusBox.className = 'status-box status-error';
        statusBox.innerText = `லைவ் செய்ய முடியவில்லை. Firestore அனுமதிகளைச் சரிபார்க்கவும்.`;
      }
    }
  </script>
</body>
</html>
