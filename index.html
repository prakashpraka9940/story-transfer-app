<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Sync Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #f8fafc;
      text-align: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="url"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 5px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    .post-section {
      display: none;
      margin-top: 25px;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .post-header h2 {
      font-size: 1.1rem;
      color: #f1f5f9;
    }

    .select-all-box {
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .post-list {
      max-height: 280px;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 20px;
    }

    .post-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .post-item:last-child {
      border-bottom: none;
    }

    .post-item input[type="checkbox"] {
      margin-top: 4px;
      cursor: pointer;
    }

    .post-details {
      flex: 1;
    }

    .post-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: #f8fafc;
      word-break: break-word;
    }

    .post-meta {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      background: #334155;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-right: 5px;
    }

    .status-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
      word-break: break-word;
    }

    .status-info {
      background: #1e3a5f;
      color: #93c5fd;
      border: 1px solid #2563eb;
    }

    .status-success {
      background: #14532d;
      color: #86efac;
      border: 1px solid #16a34a;
    }

    .status-error {
      background: #451a1a;
      color: #fca5a5;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Story Transfer Panel</h1>

    <div class="form-group">
      <label>1. Source Website (Story URL)</label>
      <input type="url" id="sourceUrl" placeholder="https://example.com" value="https://tamilsexstories.info/">
    </div>

    <div class="form-group">
      <label>2. Destination Website (Your URL)</label>
      <input type="url" id="destUrl" placeholder="https://your-site.vercel.app" value="https://darktamilworld.vercel.app/">
    </div>

    <div class="row">
      <div class="form-group">
        <label>Admin Username / Email</label>
        <input type="text" id="adminUser" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Admin Password / API Key</label>
        <input type="password" id="adminPass" placeholder="••••••••">
      </div>
    </div>

    <button type="button" id="proceedBtn" onclick="fetchSourcePosts()">Proceed & Fetch Real Posts</button>

    <div id="statusBox" class="status-box"></div>

    <div class="post-section" id="postSection">
      <div class="post-header">
        <h2>Available Posts (<span id="postCount">0</span>)</h2>
        <label class="select-all-box">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"> Select All
        </label>
      </div>

      <div class="post-list" id="postList"></div>

      <button type="button" style="background-color: #16a34a;" id="publishBtn" onclick="publishSelectedPosts()">Publish Selected Posts</button>
    </div>
  </div>

  <script>
    let fetchedStories = [];

    async function fetchSourcePosts() {
      const sourceUrl = document.getElementById('sourceUrl').value.trim();
      const statusBox = document.getElementById('statusBox');
      const proceedBtn = document.getElementById('proceedBtn');
      const postSection = document.getElementById('postSection');

      if (!sourceUrl) {
        alert('Please enter a valid source URL');
        return;
      }

      proceedBtn.disabled = true;
      proceedBtn.innerText = 'Connecting & Scraping...';
      statusBox.className = 'status-box status-info';
      statusBox.style.display = 'block';
      statusBox.innerText = 'Fetching posts via internal Vercel API...';
      postSection.style.display = 'none';

      try {
        const apiUrl = `/api/get-posts?url=${encodeURIComponent(sourceUrl)}`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error('Server request failed with status: ' + response.status);
        }

        const data = await response.json();

        if (data.posts && data.posts.length > 0) {
          fetchedStories = data.posts;
        } else if (data.rawHtml) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(data.rawHtml, 'text/html');
          const postNodes = doc.querySelectorAll('article, .post, .entry-title a, h2 a, h3 a');
          fetchedStories = [];
          let seen = new Set();
          let count = 1;

          postNodes.forEach((node) => {
            const linkElem = node.tagName.toLowerCase() === 'a' ? node : node.querySelector('a');
            const title = linkElem ? linkElem.innerText.trim() : node.innerText.trim();
            const link = linkElem ? linkElem.getAttribute('href') : '';

            if (title && title.length > 5 && !seen.has(title)) {
              seen.add(title);
              fetchedStories.push({
                id: count++,
                title: title,
                link: link,
                category: 'Story'
              });
            }
          });
        }

        if (!fetchedStories || fetchedStories.length === 0) {
          throw new Error('No stories found on the source page');
        }

        renderPosts(fetchedStories);
        document.getElementById('postCount').innerText = fetchedStories.length;
        statusBox.className = 'status-box status-success';
        statusBox.innerText = `Success! ${fetchedStories.length} posts retrieved successfully.`;
        postSection.style.display = 'block';

      } catch (err) {
        statusBox.className = 'status-box status-error';
        statusBox.innerText = `Error: ${err.message}.`;
      } finally {
        proceedBtn.disabled = false;
        proceedBtn.innerText = 'Proceed & Fetch Real Posts';
      }
    }

    function renderPosts(posts) {
      const listContainer = document.getElementById('postList');
      listContainer.innerHTML = '';

      posts.forEach(post => {
        const item = document.createElement('div');
        item.className = 'post-item';
        item.innerHTML = `
          <input type="checkbox" class="post-checkbox" value="${post.id}">
          <div class="post-details">
            <div class="post-title">${post.title}</div>
            <div class="post-meta">
              <span class="badge">${post.category}</span>
              ${post.link ? `<a href="${post.link}" target="_blank" style="color: #60a5fa; text-decoration: none;">View Source Post</a>` : ''}
            </div>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.post-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    async function publishSelectedPosts() {
      const selectedCheckboxes = document.querySelectorAll('.post-checkbox:checked');
      const destUrl = document.getElementById('destUrl').value.trim();
      const adminUser = document.getElementById('adminUser').value.trim();
      const adminPass = document.getElementById('adminPass').value.trim();
      const statusBox = document.getElementById('statusBox');

      if (!destUrl || !adminUser || !adminPass) {
        alert('Please enter Destination URL and Admin Credentials');
        return;
      }

      if (selectedCheckboxes.length === 0) {
        alert('Ethaavathu oru post-ai select pannunga');
        return;
      }

      const selectedIds = Array.from(selectedCheckboxes).map(cb => parseInt(cb.value));
      const storiesToPublish = fetchedStories.filter(s => selectedIds.includes(s.id));

      statusBox.className = 'status-box status-info';
      statusBox.style.display = 'block';
      statusBox.innerText = `Publishing ${storiesToPublish.length} stories to ${destUrl}...`;

      try {
        const response = await fetch(`${destUrl.replace(/\/$/, '')}/api/posts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Basic ' + btoa(`${adminUser}:${adminPass}`)
          },
          body: JSON.stringify({ posts: storiesToPublish })
        });

        if (response.ok) {
          statusBox.className = 'status-box status-success';
          statusBox.innerText = `Success! ${storiesToPublish.length} stories ungalathu website-il post aagivittadhu!`;
        } else {
          statusBox.className = 'status-box status-info';
          statusBox.innerText = `Stories ready! Destination site-il (/api/posts) endpoint verify seiya vendum. Selected: ${storiesToPublish.length}`;
        }
      } catch (e) {
        statusBox.className = 'status-box status-info';
        statusBox.innerText = `Stories ready! (${storiesToPublish.length} selected). Destination site API route configure aana piragu direct-aa save aagidum.`;
      }
    }
  </script>
</body>
</html>
